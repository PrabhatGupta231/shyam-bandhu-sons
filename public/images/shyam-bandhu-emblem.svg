<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 135" width="100%" height="100%">
  <defs>
    <!-- Primary Metallic Gold Gradient -->
    <linearGradient id="sbGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27" />
      <stop offset="22%" stop-color="#FDF0CD" />
      <stop offset="48%" stop-color="#DFBD69" />
      <stop offset="72%" stop-color="#B8861B" />
      <stop offset="100%" stop-color="#7D580C" />
    </linearGradient>

    <!-- Deep Gold Shadow Gradient -->
    <linearGradient id="sbGoldDark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6B4B0A" />
      <stop offset="60%" stop-color="#B8861B" />
      <stop offset="100%" stop-color="#DFBD69" />
    </linearGradient>

    <!-- Highlight Shimmer -->
    <linearGradient id="sbGoldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DFBD69" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#DFBD69" />
    </linearGradient>

    <!-- 3D Bevel Emboss Filter -->
    <filter id="sbEmboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.2" flood-color="#4A3406" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#8C6514" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#sbEmboss)">
    <!-- ==========================================
         PART 1: ROYAL TIARA / CROWN
         ========================================== -->
    <!-- Base Arched Band of Tiara -->
    <path d="M18,48 Q60,36 102,48 C98,45 80,41 60,41 C40,41 22,45 18,48 Z" fill="url(#sbGoldDark)" />
    <path d="M19,46.5 Q60,34.5 101,46.5 C97,43.5 80,39.5 60,39.5 C40,39.5 23,43.5 19,46.5 Z" fill="url(#sbGoldGrad)" stroke="#7D580C" stroke-width="0.6" />

    <!-- Tiara Base Pearls / Jewels -->
    <circle cx="25" cy="45" r="1.8" fill="url(#sbGoldShine)" />
    <circle cx="36" cy="42.5" r="1.8" fill="url(#sbGoldShine)" />
    <circle cx="48" cy="41" r="1.8" fill="url(#sbGoldShine)" />
    <circle cx="60" cy="40.5" r="2.2" fill="url(#sbGoldShine)" />
    <circle cx="72" cy="41" r="1.8" fill="url(#sbGoldShine)" />
    <circle cx="84" cy="42.5" r="1.8" fill="url(#sbGoldShine)" />
    <circle cx="95" cy="45" r="1.8" fill="url(#sbGoldShine)" />

    <!-- Tiara Filigree Body & Peaks -->
    <!-- Central Majestic Peak -->
    <path d="M60,11 C57,20 54,27 48,39 C52,38 60,38 72,39 C66,27 63,20 60,11 Z" fill="url(#sbGoldGrad)" stroke="#7D580C" stroke-width="0.7" />
    <!-- Center Peak Inner Heart / Teardrop Opening -->
    <path d="M60,19 C62,23 64,28 64,31 C64,34 62,36 60,36 C58,36 56,34 56,31 C56,28 58,23 60,19 Z" fill="#FFFFFF" fill-opacity="0.85" />

    <!-- Left Flanking Peak -->
    <path d="M37,18 C37,25 40,32 46,39 C41,39 35,41 29,43 C31,34 33,26 37,18 Z" fill="url(#sbGoldGrad)" stroke="#7D580C" stroke-width="0.7" />
    <ellipse cx="37" cy="28" rx="2.2" ry="4" fill="#FFFFFF" fill-opacity="0.75" />

    <!-- Right Flanking Peak -->
    <path d="M83,18 C83,25 80,32 74,39 C79,39 85,41 91,43 C89,34 87,26 83,18 Z" fill="url(#sbGoldGrad)" stroke="#7D580C" stroke-width="0.7" />
    <ellipse cx="83" cy="28" rx="2.2" ry="4" fill="#FFFFFF" fill-opacity="0.75" />

    <!-- Far Left Outer Peak -->
    <path d="M21,28 C23,34 25,38 27,44 C23,45 19,47 16,48 C17,41 18,34 21,28 Z" fill="url(#sbGoldGrad)" stroke="#7D580C" stroke-width="0.6" />
    <!-- Far Right Outer Peak -->
    <path d="M99,28 C97,34 95,38 93,44 C97,45 101,47 104,48 C103,41 102,34 99,28 Z" fill="url(#sbGoldGrad)" stroke="#7D580C" stroke-width="0.6" />

    <!-- Crown Finials (Jeweled Orbs / Pearls on Tiara Peaks) -->
    <circle cx="60" cy="8" r="3.2" fill="url(#sbGoldShine)" stroke="#7D580C" stroke-width="0.8" />
    <circle cx="60" cy="3.5" r="1.5" fill="url(#sbGoldShine)" />
    <circle cx="37" cy="15" r="2.6" fill="url(#sbGoldShine)" stroke="#7D580C" stroke-width="0.7" />
    <circle cx="83" cy="15" r="2.6" fill="url(#sbGoldShine)" stroke="#7D580C" stroke-width="0.7" />
    <circle cx="21" cy="26" r="2.2" fill="url(#sbGoldShine)" stroke="#7D580C" stroke-width="0.6" />
    <circle cx="99" cy="26" r="2.2" fill="url(#sbGoldShine)" stroke="#7D580C" stroke-width="0.6" />

    <!-- ==========================================
         PART 2: INTERTWINED "SB" ROYAL MONOGRAM
         ========================================== -->
    <!-- Outer Decorative Filigree Shield / Ring Accent -->
    <path d="M60,52 C78,52 92,66 92,84 C92,102 78,116 60,116 C42,116 28,102 28,84 C28,66 42,52 60,52 Z" fill="none" stroke="url(#sbGoldGrad)" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.35" />

    <!-- Stylized Ornate 'S' (Primary Royal Cipher) -->
    <!-- Top terminal curl of 'S' -->
    <path d="M72,56 C68,54 62,53 56,54 C46,55 39,61 39,69 C39,76 45,80 53,83 C63,86 70,89 70,97 C70,105 62,110 52,110 C44,110 36,106 32,101 C30,98 29,95 28,94"
          fill="none" stroke="url(#sbGoldDark)" stroke-width="9.5" stroke-linecap="round" />
    <path d="M72,56 C68,54 62,53 56,54 C46,55 39,61 39,69 C39,76 45,80 53,83 C63,86 70,89 70,97 C70,105 62,110 52,110 C44,110 36,106 32,101 C30,98 29,95 28,94"
          fill="none" stroke="url(#sbGoldGrad)" stroke-width="7.5" stroke-linecap="round" />
    <!-- Golden Core Highlight on 'S' -->
    <path d="M70,56 C66,54.5 61,54 56,55 C48,56 42,61 42,68 C42,74 47,78 54,81 C64,84 68,88 68,96 C68,103 62,108 53,108 C46,108 39,104 35,100"
          fill="none" stroke="url(#sbGoldShine)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
    
    <!-- Decorative Terminal Pearl on 'S' Top Swash -->
    <circle cx="73" cy="56" r="3" fill="url(#sbGoldShine)" stroke="#7D580C" stroke-width="0.8" />
    <!-- Decorative Terminal Pearl on 'S' Bottom Swash -->
    <circle cx="28" cy="94" r="2.6" fill="url(#sbGoldShine)" stroke="#7D580C" stroke-width="0.7" />

    <!-- Nested Stylized 'B' Inside Lower Loop of 'S' -->
    <!-- Vertical Stem of 'B' -->
    <path d="M47,72 L47,102" fill="none" stroke="url(#sbGoldDark)" stroke-width="4.8" stroke-linecap="round" />
    <path d="M47,72 L47,102" fill="none" stroke="url(#sbGoldGrad)" stroke-width="3.4" stroke-linecap="round" />
    <!-- Serifs on 'B' stem -->
    <path d="M44,72 L50,72 M44,102 L51,102" stroke="url(#sbGoldGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Upper Loop of 'B' -->
    <path d="M48,73 C57,73 63,75 63,81 C63,87 56,88 48,88"
          fill="none" stroke="url(#sbGoldDark)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M48,73 C57,73 63,75 63,81 C63,87 56,88 48,88"
          fill="none" stroke="url(#sbGoldGrad)" stroke-width="3.2" stroke-linecap="round" />

    <!-- Lower Loop of 'B' -->
    <path d="M48,88 C59,88 66,90 66,96 C66,102 58,103 48,103"
          fill="none" stroke="url(#sbGoldDark)" stroke-width="4.8" stroke-linecap="round" />
    <path d="M48,88 C59,88 66,90 66,96 C66,102 58,103 48,103"
          fill="none" stroke="url(#sbGoldGrad)" stroke-width="3.4" stroke-linecap="round" />

    <!-- Highlight core on 'B' loops -->
    <path d="M49,74 C55,74 61,76 61,81 C61,86 55,87 49,87 M49,89 C57,89 63,91 63,96 C63,101 56,102 49,102"
          fill="none" stroke="url(#sbGoldShine)" stroke-width="1.2" opacity="0.8" />
  </g>
</svg>
